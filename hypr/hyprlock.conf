source=~/.config/hypr/hyprlock/colors.conf

general {
    ignore_empty_input = true
    immediate_render = true
}

# Background — softer blurred wallpaper
background {
    path = $background_image
    blur_passes = 3
    blur_size = 9
    noise = 0.01
    brightness = 0.7
    vibrancy = 0.15
    vibrancy_darkness = 0.3
    color = rgba(141313FF)
}

# Clock — hero element, centered above midpoint
label {
    text = $TIME12
    color = $text_color
    font_size = 72
    font_family = $font_family_clock
    position = 0, 200
    halign = center
    valign = center
}

# Date — below clock
label {
    text = cmd[update:5000] date +"%A, %B %d"
    color = $text_color
    font_size = 20
    font_family = $font_family
    position = 0, 119
    halign = center
    valign = center
}

# Password input — pill-shaped, below center
input-field {
    size = 375, 70
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(49464aFF)
    inner_color = $island_bg_color
    font_color = $island_text_color
    fade_on_empty = true
    rounding = 35
    check_color = $island_accent_color
    fail_color = rgba(ffb4abFF)
    capslock_color = rgba(faba73FF)
    placeholder_text = Enter password
    shadow_passes = 2
    shadow_size = 5
    shadow_color = $island_shadow_color
    position = 0, -13
    halign = center
    valign = center
}

# Username — bottom left corner
label {
    text = 󰀉  $USER
    color = $island_subtext_color
    font_size = 16
    font_family = $font_family
    position = 38, 38
    halign = left
    valign = bottom
}

# Keyboard layout — bottom right corner
label {
    text = 󰌌  $LAYOUT
    color = $island_subtext_color
    font_size = 16
    font_family = $font_family
    position = -38, 38
    halign = right
    valign = bottom
}
