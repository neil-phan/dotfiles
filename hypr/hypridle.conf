$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' || pidof hyprlock || hyprlock
$wake_cmd = (pidof qs quickshell > /dev/null 2>&1 || qs -c floatg &) ; qs ipc call hyprsunset.refresh

general {
    lock_cmd = $lock_cmd
    unlock_cmd = qs ipc call hyprsunset.refresh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = $wake_cmd
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
    on-resume = qs ipc call hyprsunset.refresh
}
