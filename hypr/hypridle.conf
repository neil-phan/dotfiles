$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' || pidof hyprlock || hyprlock
$wake_cmd = (pidof qs quickshell > /dev/null 2>&1 || qs -c floatg &) ; qs ipc call hyprsunset.refresh

general {
    lock_cmd = $lock_cmd
    unlock_cmd = qs ipc call hyprsunset.refresh
    before_sleep_cmd = loginctl lock-session && sleep 0.5 && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' ; $wake_cmd
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' ; qs ipc call hyprsunset.refresh
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' ; $wake_cmd
}
