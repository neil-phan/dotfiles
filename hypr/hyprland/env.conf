# ############ Wayland #############
env = ELECTRON_OZONE_PLATFORM_HINT,auto

######### Applications #########
env = XDG_DATA_DIRS,$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share

# ############ Themes #############
env = QT_QPA_PLATFORM, wayland
env = QT_QPA_PLATFORMTHEME, kde
env = XDG_MENU_PREFIX, plasma-

# ######## Virtual envrionment #########
env = FLOATING_GARDEN_VIRTUAL_ENV, ~/.local/state/quickshell/.venv

# ######## Terminal application #########
env = TERMINAL,ghostty

# ############ HiDPI Toolkit Scaling (compositor at 1.0x) #############
env = QT_AUTO_SCREEN_SCALE_FACTOR, 0
env = QT_SCALE_FACTOR, 1.5
env = XCURSOR_SIZE, 36

# ############ NVIDIA Wayland #############
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
